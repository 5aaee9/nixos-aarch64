# Garbage collection for the hestia binary cache.
#
# GC must run on the default branch: PR cache scopes are read-only towards
# the default branch and die with the PR, but the default-branch scope
# grows forever without GC.
name: Cache GC

concurrency:
  group: hestia-gc
  cancel-in-progress: false

on:
  schedule:
    # Daily, off-peak (UTC).
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gc:
    runs-on: ubuntu-latest
    permissions:
      # REST cache deletes need actions: write.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Installs the hestia binary and captures the GHA cache API tokens
      # (ACTIONS_RUNTIME_TOKEN / ACTIONS_RESULTS_URL) needed by `hestia gc`.
      - uses: Mic92/hestia@v1

      - name: Run garbage collection
        run: |
          set -euo pipefail
          "$HESTIA_BIN" gc ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
