name: Release images

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: release-images
  cancel-in-progress: true

jobs:
  cache-packages:
    name: Build and cache packages
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false
            filter-syscalls = false

      - name: Set up hestia cache
        uses: Mic92/hestia@v1
        with:
          upstream-cache-filter: true

      - name: Check native build platform
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(nix eval --raw --impure --expr builtins.currentSystem)" = "aarch64-linux"

      - name: Build packages
        run: |
          set -euo pipefail
          nix build --no-link -L \
            .#linux-bigtreetech \
            .#linux-fly-gemini \
            .#linux-panther-x2 \
            .#linux-orangepi-3b \
            .#fly-gemini-uboot \
            .#radxa-e20c-uboot \
            .#fastrhino-r68s-uboot \
            .#orangepi-3b-uboot \
            .#panther-x2-uboot \
            .#uwe5622-firmware

  build-image:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-24.04-arm
    needs: cache-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: sdimage-bigtreetech
            asset: nixos-bigtreetech-sdimage
            needs-repart: false
          - package: sdimage-fly-gemini
            asset: nixos-fly-gemini-sdimage
            needs-repart: false
          - package: sdimage-radxa-e20c
            asset: nixos-radxa-e20c-sdimage
            needs-repart: false
          - package: sdimage-fastrhino-r68s
            asset: nixos-fastrhino-r68s-sdimage
            needs-repart: false
          - package: sdimage-orangepi-3b
            asset: nixos-orangepi-3b-sdimage
            needs-repart: false
          - package: sdimage-panther-x2
            asset: nixos-panther-x2-sdimage
            needs-repart: false
          - package: repart-radxa-e20c
            asset: nixos-radxa-e20c-repart
            needs-repart: true
          - package: repart-fastrhino-r68s
            asset: nixos-fastrhino-r68s-repart
            needs-repart: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false
            filter-syscalls = false

      - name: Set up hestia cache
        uses: Mic92/hestia@v1

      - name: Check native build platform
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(nix eval --raw --impure --expr builtins.currentSystem)" = "aarch64-linux"

      - name: Check repart user namespace support
        if: matrix.needs-repart
        run: |
          set -euo pipefail

          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || true
          unshare --map-root-user true
          cat > check-repart-unshare.nix <<'EOF'
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = builtins.currentSystem; };
            in
            pkgs.runCommand "check-repart-unshare"
              { nativeBuildInputs = [ pkgs.util-linux ]; }
              "unshare --map-root-user true; touch $out"
          EOF
          nix build --impure -f ./check-repart-unshare.nix --out-link ./result-check-repart-unshare

      - name: Build image
        run: |
          set -euo pipefail
          # Disable the post-build-hook so the multi-GB image is NOT pushed
          # to the hestia cache.  Packages were already cached by the
          # cache-packages job; the hestia substituter stays configured so
          # they are pulled from cache instead of rebuilt.
          no_hook_conf="$RUNNER_TEMP/no-hook.conf"
          printf 'post-build-hook =\n' > "$no_hook_conf"
          export NIX_USER_CONF_FILES="${no_hook_conf}:${NIX_USER_CONF_FILES}"
          nix build ".#${{ matrix.package }}" -L --out-link ./result-image

      - name: Prepare image artifact
        run: |
          set -euo pipefail

          mkdir -p dist

          stage_image() {
            local out_link=$1
            local asset_stem=$2
            local image_dir="$out_link/sd-image"
            local image
            local base

            mapfile -t images < <(find "$image_dir" -maxdepth 1 -type f | sort)
            if [ "${#images[@]}" -ne 1 ]; then
              printf 'Expected exactly one image in %s, found %s\n' "$image_dir" "${#images[@]}" >&2
              printf '%s\n' "${images[@]}" >&2
              exit 1
            fi

            image="${images[0]}"
            base="$(basename "$image")"

            case "$base" in
              *.raw)
                zstd -T0 -19 --long=27 -f "$image" -o "dist/${asset_stem}.raw.zst"
                ;;
              *.img)
                zstd -T0 -19 --long=27 -f "$image" -o "dist/${asset_stem}.img.zst"
                ;;
              *.raw.zst)
                cp -L "$image" "dist/${asset_stem}.raw.zst"
                ;;
              *.img.zst)
                cp -L "$image" "dist/${asset_stem}.img.zst"
                ;;
              *.gz | *.xz | *.zst)
                cp -L "$image" "dist/${asset_stem}.${base##*.}"
                ;;
              *)
                cp -L "$image" "dist/${asset_stem}-${base}"
                ;;
            esac
          }

          stage_image result-image "${{ matrix.asset }}"
          ls -lh dist
          df -h

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release-images:
    name: Refresh dummy release
    runs-on: ubuntu-24.04-arm
    needs: build-image
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download image artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail

          mkdir -p dist

          if ! find dist -maxdepth 1 -type f | grep -q .; then
            echo "No successful image artifacts were produced; skipping release upload." >&2
            exit 1
          fi

          (
            cd dist
            sha256sum ./* > SHA256SUMS
          )
          ls -lh dist

      - name: Refresh dummy release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: latest-images
          RELEASE_TITLE: Latest generated images
        run: |
          set -euo pipefail

          release_notes="$(mktemp)"
          cat > "$release_notes" <<EOF
          This is a moving dummy release generated by CI.

          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Previous assets are deleted before the current build outputs are uploaded.
          EOF

          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/${RELEASE_TAG}"

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$release_notes" \
              --prerelease \
              --latest=false

            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json assets \
              --jq '.assets[].name' |
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GH_REPO" --yes
              done
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$release_notes" \
              --prerelease \
              --latest=false
          fi

          gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO" --clobber

  cleanup-artifacts:
    name: Delete workflow artifacts
    runs-on: ubuntu-24.04-arm
    needs:
      - build-image
      - release-images
    if: always()
    steps:
      - name: Delete workflow artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate --jq '.artifacts[].id' |
            while IFS= read -r artifact_id; do
              [ -n "$artifact_id" ] || continue
              gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${artifact_id}"
            done
