name: Release images

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-images
  cancel-in-progress: true

jobs:
  release-images:
    name: Build and refresh dummy release
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false
            filter-syscalls = false

      - name: Check native build platform
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(nix eval --raw --impure --expr builtins.currentSystem)" = "aarch64-linux"

      - name: Check repart user namespace support
        run: |
          set -euo pipefail

          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || true
          unshare --map-root-user true
          cat > check-repart-unshare.nix <<'EOF'
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = builtins.currentSystem; };
            in
            pkgs.runCommand "check-repart-unshare"
              { nativeBuildInputs = [ pkgs.util-linux ]; }
              "unshare --map-root-user true; touch $out"
          EOF
          nix build --impure -f ./check-repart-unshare.nix --out-link ./result-check-repart-unshare

      - name: Build images
        run: |
          set -euo pipefail
          nix build .#sdimage-radxa-e20c -L --out-link ./result-sdimage
          nix build .#repart-radxa-e20c -L --out-link ./result-repart

      - name: Prepare release assets
        run: |
          set -euo pipefail

          mkdir -p dist

          stage_image() {
            local out_link=$1
            local asset_stem=$2
            local image_dir="$out_link/sd-image"
            local image
            local base

            mapfile -t images < <(find "$image_dir" -maxdepth 1 -type f | sort)
            if [ "${#images[@]}" -ne 1 ]; then
              printf 'Expected exactly one image in %s, found %s\n' "$image_dir" "${#images[@]}" >&2
              printf '%s\n' "${images[@]}" >&2
              exit 1
            fi

            image="${images[0]}"
            base="$(basename "$image")"

            case "$base" in
              *.raw)
                zstd -T0 -19 --long=27 -f "$image" -o "dist/${asset_stem}.raw.zst"
                ;;
              *.img)
                zstd -T0 -19 --long=27 -f "$image" -o "dist/${asset_stem}.img.zst"
                ;;
              *.raw.zst)
                cp -L "$image" "dist/${asset_stem}.raw.zst"
                ;;
              *.img.zst)
                cp -L "$image" "dist/${asset_stem}.img.zst"
                ;;
              *.gz | *.xz | *.zst)
                cp -L "$image" "dist/${asset_stem}.${base##*.}"
                ;;
              *)
                cp -L "$image" "dist/${asset_stem}-${base}"
                ;;
            esac
          }

          stage_image result-sdimage nixos-radxa-e20c-sdimage
          stage_image result-repart nixos-radxa-e20c-repart

          (
            cd dist
            sha256sum ./* > SHA256SUMS
          )

          ls -lh dist
          df -h

      - name: Refresh dummy release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: latest-images
          RELEASE_TITLE: Latest generated images
        run: |
          set -euo pipefail

          release_notes="$(mktemp)"
          cat > "$release_notes" <<EOF
          This is a moving dummy release generated by CI.

          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Previous assets are deleted before the current build outputs are uploaded.
          EOF

          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/${RELEASE_TAG}"

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$release_notes" \
              --prerelease \
              --latest=false

            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json assets \
              --jq '.assets[].name' |
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GH_REPO" --yes
              done
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$release_notes" \
              --prerelease \
              --latest=false
          fi

          gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO" --clobber
