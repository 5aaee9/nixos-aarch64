name: Release images

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-images
  cancel-in-progress: true

jobs:
  release-images:
    name: Build and refresh dummy release
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check native build platform
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(nix eval --raw --impure --expr builtins.currentSystem)" = "aarch64-linux"

      - name: Build images
        run: |
          set -euo pipefail
          nix build .#sdimage-radxa-e20c -L --out-link ./result-sdimage
          nix build .#repart-radxa-e20c -L --out-link ./result-repart

      - name: Prepare release assets
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p dist

          sd_images=(result-sdimage/sd-image/*.img.zst)
          if [ "${#sd_images[@]}" -ne 1 ]; then
            echo "Expected exactly one compressed sdimage, found ${#sd_images[@]}" >&2
            exit 1
          fi

          cp -L "${sd_images[0]}" dist/nixos-radxa-e20c-sdimage.img.zst
          zstd -T0 -19 -f \
            -o dist/nixos-radxa-e20c-repart.raw.zst \
            result-repart/sd-image/nixos-radxa-e20c-repart.raw
          (cd dist && sha256sum ./*.zst > SHA256SUMS)
          ls -lh dist

      - name: Refresh dummy release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: latest-images
          RELEASE_TITLE: Latest generated images
        run: |
          set -euo pipefail

          release_notes="$(mktemp)"
          cat > "$release_notes" <<EOF
          This is a moving dummy release generated by CI.

          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/${RELEASE_TAG}"

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$release_notes" \
              --prerelease \
              --latest=false

            gh release view "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --json assets \
              --jq '.assets[].name' |
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GH_REPO" --yes
              done
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$release_notes" \
              --prerelease \
              --latest=false
          fi

          gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO" --clobber
